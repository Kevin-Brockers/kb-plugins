schema_version: "1.1"
name: setup-repo-missing-gitignore
description: main, dev and origin exist; .gitignore and the pre-commit config are missing.
tags: [setup-repo, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Check that this repo is set up properly for my workflow and fix whatever is missing.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: setup-repo
  - name: gitignore-covers-secrets
    type: regex
    target: {source: file, path: .gitignore}
    flags: m
    pattern: '^(?=[\s\S]*^\.env$)(?=[\s\S]*^\.env\.\*$)(?=[\s\S]*^!\.env\.example$)(?=[\s\S]*^\*\.pem$)(?=[\s\S]*^\*\.key$)'
  - name: no-precommit-config-without-approval
    type: file_exists
    path: .pre-commit-config.yaml
    exists: false
  - name: no-push-to-main-or-dev
    type: tool_used
    tool: Bash
    input_match: 'git push[^"]*\b(main|dev)\b'
    min: 0
    max: 0
    arm: both
  - name: summary
    type: llm
    criteria: |
      Pass only if all hold:
      1. It says the git repo, the main and dev branches, the remote and CHANGELOG.md were already in place.
      2. It says it created .gitignore with entries for .env, .env.*, !.env.example, *.pem and *.key.
      3. It proposes a pre-commit config and asks for approval instead of adding it.
      4. It lists what the maintainer still has to do (at least: approve the pre-commit config; install or run prek).
