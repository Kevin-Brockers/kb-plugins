schema_version: "1.1"
name: setup-repo-fresh-project
description: A new project with git init but no commit; it contains a .env that must not be committed.
tags: [setup-repo, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: This is a brand-new project. Set it up with my usual git workflow.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: setup-repo
  - name: no-commit-before-asking
    type: tool_used
    tool: Bash
    input_match: 'git commit'
    min: 0
    max: 0
    arm: both
  - name: no-precommit-config-without-approval
    type: file_exists
    path: .pre-commit-config.yaml
    exists: false
  - name: asks-about-initial-commit
    type: llm
    criteria: |
      The folder holds README.md, AGENTS.md, check.sh, todo.py and a .env with a token, and has no commits yet. Pass only if all hold:
      1. The reply asks the maintainer which files belong in the initial commit (it may propose a list) instead of saying it already committed.
      2. It says .env must not be committed (e.g. it should be gitignored) and does not propose committing it.
      3. It does not claim a dev branch, pre-commit config or GitHub repository was created.
