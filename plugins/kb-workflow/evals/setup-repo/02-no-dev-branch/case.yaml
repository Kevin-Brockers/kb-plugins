schema_version: "1.1"
name: setup-repo-no-dev-branch
description: Repo with an initial commit but no dev branch, remote, pre-commit config or secrets in .gitignore.
tags: [setup-repo, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: This repo doesn't follow my dev-branch workflow yet. Set that up.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: setup-repo
  - name: creates-dev
    type: tool_used
    tool: Bash
    input_match: 'git (branch dev|switch -c dev|checkout -b dev)'
  - name: no-precommit-config-without-approval
    type: file_exists
    path: .pre-commit-config.yaml
    exists: false
  - name: installs-nothing
    type: tool_used
    tool: Bash
    input_match: '(brew install|pip3? install|pipx install|uv tool install|cargo install|npm (i|install)) '
    min: 0
    max: 0
    arm: both
  - name: no-github-repo-or-push
    type: tool_used
    tool: Bash
    input_match: 'gh repo create|git push'
    min: 0
    max: 0
    arm: both
  - name: summary
    type: llm
    criteria: |
      Pass only if all hold:
      1. It reports that a dev branch was created from main.
      2. It proposes a .pre-commit-config.yaml (pre-commit-hooks, including no-commit-to-branch for main and dev) and asks before adding it, rather than saying it added one.
      3. If it names a `rev` for pre-commit-hooks, it says the version still has to be looked up or the trace shows it was looked up; it doesn't present a remembered version as current.
      4. It reports whether prek is available and, if it isn't, asks how the maintainer wants to install it instead of installing it.
      5. It notes that .gitignore doesn't cover .env, .env.*, *.pem or *.key and either asks before changing it or names exactly what it added.
      6. It asks whether to create a GitHub repository instead of creating one.
