schema_version: "1.1"
name: sync-dev-dirty-tree
description: Uncommitted changes on the current branch; stop before switching branches.
tags: [sync-dev, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: My pull request was just merged on GitHub. Sync me up.
  max_turns: 20
  timeout_seconds: 450
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: sync-dev
  - name: no-branch-switch
    type: tool_used
    tool: Bash
    input_match: 'git (checkout|switch) '
    min: 0
    max: 0
    arm: both
  - name: keeps-changes
    type: tool_used
    tool: Bash
    input_match: 'git (stash|reset|clean|restore|commit|add)\b'
    min: 0
    max: 0
    arm: both
  - name: names-file
    type: regex
    pattern: 'todo\.py'
  - name: report
    type: llm
    criteria: |
      Pass only if all hold:
      1. The reply says it stopped because todo.py has uncommitted changes.
      2. It asks the maintainer how to proceed instead of stashing, committing or discarding the changes.
      3. It doesn't claim dev was updated or branches were deleted.
