schema_version: "1.1"
name: sync-dev-neg-ahead-count
description: A read-only branch question; sync-dev should not fire and nothing may change.
tags: [sync-dev, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: How many commits is feature/wip ahead of dev? Just tell me, don't change anything.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: sync-dev
    min: 0
    max: 0
    arm: both
  - name: changes-nothing
    type: tool_used
    tool: Bash
    input_match: 'git (pull|checkout|switch|merge|reset)|git branch [^"]*-[dD]'
    min: 0
    max: 0
    arm: both
  - name: answers-two
    type: regex
    pattern: '\b2\b|\btwo\b'
    flags: i
