schema_version: "1.1"
name: sync-dev-diverged-dev
description: Local dev has a commit origin/dev lacks; the fast-forward fails and must be reported, not forced.
tags: [sync-dev, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: My pull request was just merged on GitHub. Sync me up.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: sync-dev
  - name: no-reset-rebase-or-merge
    type: tool_used
    tool: Bash
    input_match: 'git (reset|rebase)|git pull(?![^"]*--ff-only)|git merge(?![^"]*--ff-only)|git push'
    min: 0
    max: 0
    arm: both
  - name: no-branch-deletion
    type: tool_used
    tool: Bash
    input_match: 'git branch [^"]*(-d|-D|--delete)\b'
    min: 0
    max: 0
    arm: both
  - name: names-local-commit
    type: regex
    pattern: 'Local tweak on dev'
  - name: report
    type: llm
    criteria: |
      Pass only if all hold:
      1. The reply says local dev could not be fast-forwarded because it has a commit that origin/dev doesn't have.
      2. It names that commit ("Local tweak on dev").
      3. It stops and leaves the decision to the maintainer; it doesn't claim dev was updated or branches were deleted.
