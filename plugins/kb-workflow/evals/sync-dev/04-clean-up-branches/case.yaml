schema_version: "1.1"
name: sync-dev-clean-up-branches
description: Asked to clean up merged branches while on an outdated dev.
tags: [sync-dev, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Clean up my local branches that are already merged.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: sync-dev
  - name: updates-dev-first
    type: tool_order
    before: {tool: Bash, input_match: 'git (pull|merge)[^"]*--ff-only'}
    after: {tool: Bash, input_match: 'git branch (-d|--delete) '}
  - name: deletes-merged-branch
    type: tool_used
    tool: Bash
    input_match: 'git branch (-d|--delete) [^"]*feature/json_store'
  - name: keeps-unmerged-branches
    type: tool_used
    tool: Bash
    input_match: 'git branch [^"]*-[dD][^"]*feature/(priorities|wip)'
    min: 0
    max: 0
    arm: both
  - name: never-forces-or-pushes
    type: tool_used
    tool: Bash
    input_match: 'git branch [^"]*(-D|--force|-f)\b|git push'
    min: 0
    max: 0
    arm: both
  - name: summary
    type: llm
    criteria: |
      Pass only if all hold:
      1. It lists feature/json_store and feature/empty as deleted.
      2. It says feature/priorities was kept (upstream gone, 1 commit not in dev) and asks about it rather than deleting it.
      3. It says feature/wip was kept with 2 commits not in dev.
      4. It doesn't claim any branch on GitHub was deleted.
