schema_version: "1.1"
name: add-dependency-coverage
description: Coverage numbers need a new dev dependency (pytest-cov); the agent must ask first.
tags: [add-dependency, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I'd like to see test coverage numbers when I run the tests.
  max_turns: 20
  timeout_seconds: 450
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: add-dependency
  - name: no-unapproved-install
    type: tool_used
    tool: Bash
    input_match: 'uv add|uv pip install|pip3? install|poetry add'
    min: 0
    max: 0
    arm: both
  - name: pyproject-unchanged
    type: regex
    target: {source: file, path: pyproject.toml}
    pattern: 'pytest-cov|coverage'
    match: not_contains
  - name: asks-with-justification
    type: llm
    criteria: |
      Pass only if all hold:
      1. The reply asks the maintainer to approve a coverage tool (e.g. pytest-cov or coverage) before adding it.
      2. It says it would be a dev dependency and what it is for.
      3. It doesn't claim the dependency was added or coverage was configured.
      4. Any version it names is presented as looked up (or to be looked up), not as a remembered fact.
