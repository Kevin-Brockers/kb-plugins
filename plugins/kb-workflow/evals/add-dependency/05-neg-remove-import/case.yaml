schema_version: "1.1"
name: add-dependency-neg-remove-import
description: Removing an unused import has nothing to do with dependencies.
tags: [add-dependency, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Remove the unused `import os` from todo.py.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: add-dependency
    min: 0
    max: 0
    arm: both
  - name: import-removed
    type: regex
    target: {source: file, path: todo.py}
    flags: m
    pattern: '^import os$'
    match: not_contains
  - name: other-imports-kept
    type: regex
    target: {source: file, path: todo.py}
    flags: m
    pattern: '^import json$'
