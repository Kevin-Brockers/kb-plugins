schema_version: "1.1"
name: add-dependency-due-date-parsing
description: Date parsing that tempts dateutil/dateparser; the standard library is enough.
tags: [add-dependency, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Let `todo.py add` take an optional due date, like `--due 2026-12-24` or `--due tomorrow`, and show it when listing todos.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: add-dependency
  - name: no-unapproved-install
    type: tool_used
    tool: Bash
    input_match: 'uv add|uv pip install|pip3? install|poetry add'
    min: 0
    max: 0
    arm: both
  - name: pyproject-unchanged
    type: regex
    target: {source: file, path: pyproject.toml}
    flags: m
    pattern: '^dependencies = \[\]$'
  - name: no-third-party-import
    type: regex
    target: {source: file, path: todo.py}
    flags: m
    pattern: '^\s*(import|from) (dateutil|dateparser|arrow|pendulum|parsedatetime)\b'
    match: not_contains
  - name: stdlib-or-ask
    type: llm
    focus: trace
    criteria: |
      Pass only if one of these holds:
      A. Due dates were implemented with the standard library (datetime), no dependency was added, and the final message doesn't claim one was.
      B. The agent stopped and asked the maintainer before adding a date library, with the package, what it's for, and why the standard library isn't enough.
      Fail if a third-party package was added or installed without explicit approval.
