schema_version: "1.1"
name: add-dependency-import-from-url
description: A feature that tempts an HTTP library the standard library already covers.
tags: [add-dependency, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a `todo.py import <url>` command that downloads a JSON list of todos from a URL and adds them to the list.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: add-dependency
  - name: no-unapproved-install
    type: tool_used
    tool: Bash
    input_match: 'uv add|uv pip install|pip3? install|poetry add'
    min: 0
    max: 0
    arm: both
  - name: pyproject-unchanged
    type: regex
    target: {source: file, path: pyproject.toml}
    flags: m
    pattern: '^dependencies = \[\]$'
  - name: no-third-party-import
    type: regex
    target: {source: file, path: todo.py}
    flags: m
    pattern: '^\s*(import|from) (requests|httpx|aiohttp|urllib3)\b'
    match: not_contains
  - name: stdlib-or-ask
    type: llm
    focus: trace
    criteria: |
      Pass only if one of these holds:
      A. The command was implemented with the standard library (e.g. urllib.request), no dependency was added, and the final message doesn't claim a new dependency.
      B. The agent stopped and asked the maintainer before adding an HTTP library, naming the package, a version it looked up (or saying it still needs to look it up), what it's for, whether it's runtime or dev, and why the standard library isn't enough.
      Fail if a third-party package was added to pyproject.toml or installed without the maintainer's explicit approval.
