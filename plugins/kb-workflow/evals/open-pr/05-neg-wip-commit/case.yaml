schema_version: "1.1"
name: open-pr-neg-wip-commit
description: A local checkpoint commit; open-pr should not fire and nothing may be pushed.
tags: [open-pr, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Commit what I have as a checkpoint. Don't push or open anything yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: open-pr
    min: 0
    max: 0
    arm: both
  - name: commits
    type: tool_used
    tool: Bash
    input_match: 'git commit'
  - name: no-push-or-pr
    type: tool_used
    tool: Bash
    input_match: 'git push|gh pr'
    min: 0
    max: 0
    arm: both
