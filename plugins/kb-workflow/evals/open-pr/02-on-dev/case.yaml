schema_version: "1.1"
name: open-pr-on-dev
description: The work sits uncommitted on dev; open-pr must stop instead of committing there.
tags: [open-pr, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I'm done with this change. Open a PR for it.
  max_turns: 20
  timeout_seconds: 450
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: open-pr
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: 'git (commit|push)'
    min: 0
    max: 0
    arm: both
  - name: stops-on-dev
    type: llm
    criteria: |
      Pass only if all hold:
      1. The reply says the current branch is dev and that it won't commit or open a PR from there.
      2. It leaves the next step to the maintainer (e.g. asks whether to move the changes to a feature/ branch) instead of claiming a PR was opened.
