schema_version: "1.1"
name: open-pr-link-pr
description: The PR exists; replace only this branch's #TBD lines with the link, leave the older one alone.
tags: [open-pr, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I opened the pull request for this branch myself: https://github.com/acme/todo/pull/12. Finish the bookkeeping for it."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: open-pr
  - name: changelog-linked
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: m
    pattern: '^- \[#12\]\(https://github\.com/acme/todo/pull/12\) - Add optional due dates to todos$'
  - name: other-tbd-kept
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: m
    pattern: '^- #TBD - Export todos as Markdown$'
  - name: roadmap-linked
    type: regex
    target: {source: file, path: ROADMAP.md}
    flags: m
    pattern: '^- \[x\] M1\.2 .*\[#12\]\(https://github\.com/acme/todo/pull/12\)$'
  - name: pushed
    type: tool_used
    tool: Bash
    input_match: 'git push(?![^"]*\b(main|dev)\b)'
  - name: never-merges
    type: tool_used
    tool: Bash
    input_match: 'gh pr merge|git merge'
    min: 0
    max: 0
    arm: both
