schema_version: "1.1"
name: init-work-dependency-order
description: The first open step (M1.2) depends on a later open step (M1.3), so M1.3 is next.
tags: [init-work, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What should I work on next in this repo?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: init-work
  - name: picks-unblocked-step
    type: llm
    criteria: |
      In ROADMAP.md, M1.1 is done, M1.2 is open but depends on M1.3, M1.3 is open and depends only on M1.1, and M2.1 depends only on M1.1. Pass only if all hold:
      1. The reply proposes M1.3 ("List overdue todos", branch feature/overdue_list) as the next step (mentioning M2.1 as another unblocked option is fine).
      2. It does not propose M1.2 as the next step to start.
      3. It points out that M1.2 is blocked by M1.3 or that the order/dependencies look inconsistent.
  - name: no-branch-yet
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b|branch [a-z])'
    min: 0
    max: 0
    arm: both
