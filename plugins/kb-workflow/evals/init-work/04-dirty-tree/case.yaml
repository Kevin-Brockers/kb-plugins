schema_version: "1.1"
name: init-work-dirty-tree
description: Uncommitted changes in the working tree; the skill must stop before creating the branch.
tags: [init-work, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Let's do roadmap step M1.2 now. Set up the branch for it so I can start.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: init-work
  - name: no-branch
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b|branch [a-z])'
    min: 0
    max: 0
    arm: both
  - name: keeps-changes
    type: tool_used
    tool: Bash
    input_match: 'git (stash|reset|clean|restore|checkout --|add|commit)'
    min: 0
    max: 0
    arm: both
  - name: names-files
    type: regex
    pattern: 'notes\.txt'
  - name: report
    type: llm
    criteria: |
      The working tree had an uncommitted change to README.md and an untracked notes.txt. Pass only if all hold:
      1. The reply says it stopped (or did not create the branch) because of uncommitted changes.
      2. It names README.md and notes.txt.
      3. It leaves the decision to the maintainer (asks how to proceed) rather than saying it stashed, committed or discarded them.
