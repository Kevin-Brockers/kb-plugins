schema_version: "1.1"
name: init-work-create-branch
description: The maintainer has picked M1.2; the branch must come from the latest origin/dev.
tags: [init-work, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Let's do roadmap step M1.2 now. Set up the branch for it so I can start.
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: init-work
  - name: creates-roadmap-branch
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b) feature/due_dates'
  - name: fetches-dev
    type: tool_used
    tool: Bash
    input_match: 'git fetch'
  - name: fetch-before-branch
    type: tool_order
    before: {tool: Bash, input_match: 'git fetch'}
    after: {tool: Bash, input_match: 'git (switch -c|checkout -b) feature/due_dates'}
  - name: no-implementation
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: report
    type: llm
    focus: trace
    criteria: |
      Pass only if all hold:
      1. A branch named exactly feature/due_dates was created from origin/dev (the command names origin/dev as the start point) after fetching origin.
      2. Nothing was committed, pushed or edited.
      3. The final message says the branch is ready and does not claim any implementation work was done.
