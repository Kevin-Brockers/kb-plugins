schema_version: "1.1"
name: init-work-neg-show-log
description: A plain git question in a repo with a roadmap; init-work should not fire.
tags: [init-work, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Show me the last 3 commits on dev.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: init-work
    min: 0
    max: 0
    arm: both
  - name: lists-commits
    type: regex
    pattern: 'Note the minimum Python version[\s\S]*Explain where todos are stored[\s\S]*Document the add command'
  - name: no-roadmap-summary
    type: regex
    pattern: 'M1\.2'
    match: not_contains
