schema_version: "1.1"
name: init-work-next-step
description: Start of a session in a repo whose roadmap has M1.2 as the next open step.
tags: [init-work, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Morning! Let's pick up where we left off on this project. What's next?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: init-work
  - name: names-next-step
    type: regex
    pattern: 'M1\.2'
  - name: names-branch
    type: regex
    pattern: 'feature/due_dates'
  - name: waits-before-branching
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b|branch [a-z])'
    min: 0
    max: 0
    arm: both
  - name: summary
    type: llm
    criteria: |
      The reply is a summary of the next roadmap step for the maintainer. Pass only if all hold:
      1. It names step M1.2 ("Add optional due dates to todos") as the next step.
      2. It gives the branch name feature/due_dates.
      3. It does not present M1.3 or M2.1 as the step to do next.
      4. It waits for the maintainer to confirm (asks or offers to start) instead of saying it has already started implementing.
