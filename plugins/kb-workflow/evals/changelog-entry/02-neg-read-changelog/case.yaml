schema_version: "1.1"
name: changelog-entry-neg-read-changelog
description: A read-only question about the changelog; changelog-entry should not fire.
tags: [changelog-entry, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What has changed since version 0.1.0, according to the changelog?
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: changelog-entry
    min: 0
    max: 0
    arm: both
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: answers
    type: regex
    flags: i
    pattern: 'JSON'
