schema_version: "1.1"
name: changelog-entry-fix-new-category
description: A bug fix needs a new "### Fixed" section under [Unreleased], after Added.
tags: [changelog-entry, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I fixed the crash when todos.json is empty. Please record that in the changelog.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: changelog-entry
  - name: fixed-after-added-in-unreleased
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: mi
    pattern: '^## \[Unreleased\]\n(?:(?!^## )[\s\S])*?^### Added\n(?:(?!^## )[\s\S])*?^### Fixed\n\n?- #TBD - .*empty'
  - name: one-fixed-section
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: m
    pattern: '^### Fixed$'
    match: 'count:1'
  - name: no-invented-links
    type: regex
    target: {source: file, path: CHANGELOG.md}
    pattern: '/pull/'
    match: 'count:1'
