schema_version: "1.1"
name: changelog-entry-feature-added
description: A feature branch is done; the entry goes under [Unreleased] / Added with #TBD.
tags: [changelog-entry, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I just finished adding optional due dates on this branch. Add the changelog entry for it.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: changelog-entry
  - name: entry-under-unreleased-added
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: mi
    pattern: '^## \[Unreleased\]\n(?:(?!^## )[\s\S])*?^### Added\n(?:(?!^##)[\s\S])*?^- #TBD - .*due date'
  - name: one-tbd-entry
    type: regex
    target: {source: file, path: CHANGELOG.md}
    pattern: '#TBD'
    match: 'count:1'
  - name: no-invented-links
    type: regex
    target: {source: file, path: CHANGELOG.md}
    pattern: '/pull/'
    match: 'count:1'
  - name: release-section-untouched
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: m
    pattern: '^## \[0\.1\.0\] - 2026-10-01\n\n### Added\n\n- \[7982e5c\]\(https://github\.com/acme/todo/commit/7982e5c4b1d2a3f4e5d6c7b8a9f0e1d2c3b4a5f6\) - Initial commit\n'
