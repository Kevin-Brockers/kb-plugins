schema_version: "1.1"
name: changelog-entry-no-changelog
description: There is no CHANGELOG.md; the skill asks before creating one.
tags: [changelog-entry, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I just finished adding optional due dates on this branch. Add the changelog entry for it.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: changelog-entry
  - name: no-changelog-created
    type: file_exists
    path: CHANGELOG.md
    exists: false
  - name: asks-first
    type: llm
    criteria: |
      The repo has no CHANGELOG.md. Pass only if all hold:
      1. The reply says there is no CHANGELOG.md.
      2. It asks the maintainer whether to create one (proposing the Keep a Changelog format and the entry is fine) instead of saying it created it.
