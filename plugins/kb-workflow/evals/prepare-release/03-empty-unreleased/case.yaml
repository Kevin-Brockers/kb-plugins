schema_version: "1.1"
name: prepare-release-empty-unreleased
description: "[Unreleased] has no entries; the skill must stop and ask."
tags: [prepare-release, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Let's release 0.1.1, with 2026-11-24 as the release date. Prepare it.
  max_turns: 20
  timeout_seconds: 450
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: prepare-release
  - name: changelog-not-renamed
    type: regex
    target: {source: file, path: CHANGELOG.md}
    pattern: '## \[0\.1\.1\]'
    match: not_contains
  - name: version-unchanged
    type: regex
    target: {source: file, path: pyproject.toml}
    flags: m
    pattern: '^version = "0\.1\.1\.dev0"$'
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: 'git (commit|push)'
    min: 0
    max: 0
    arm: both
  - name: stops-and-asks
    type: llm
    criteria: |
      Pass only if all hold:
      1. The reply says [Unreleased] in CHANGELOG.md has no entries.
      2. It stops and asks the maintainer how to proceed instead of preparing the release.
