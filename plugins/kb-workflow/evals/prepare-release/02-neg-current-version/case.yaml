schema_version: "1.1"
name: prepare-release-neg-current-version
description: A version question; prepare-release should not fire.
tags: [prepare-release, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What version is this project at right now?
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: prepare-release
    min: 0
    max: 0
    arm: both
  - name: answers
    type: regex
    pattern: '0\.2\.0\.dev0'
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
