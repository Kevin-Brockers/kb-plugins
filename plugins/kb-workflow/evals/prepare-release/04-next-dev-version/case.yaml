schema_version: "1.1"
name: prepare-release-next-dev-version
description: After the tag; set the next development version without a changelog entry.
tags: [prepare-release, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 0.2.0 is tagged and released. Set up the next development version, 0.3.0.dev0.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: prepare-release
  - name: next-dev-branch
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b) chore/next_dev_version'
  - name: version-set
    type: regex
    target: {source: file, path: pyproject.toml}
    flags: m
    pattern: '^version = "0\.3\.0\.dev0"$'
  - name: no-changelog-entry
    type: regex
    target: {source: file, path: CHANGELOG.md}
    pattern: '#TBD|0\.3\.0'
    match: not_contains
  - name: no-tag-merge-or-main
    type: tool_used
    tool: Bash
    input_match: 'git tag|gh pr merge|git merge|git push[^"]*\b(main|dev)\b|--base main'
    min: 0
    max: 0
    arm: both
