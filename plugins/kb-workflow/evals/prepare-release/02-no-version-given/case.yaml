schema_version: "1.1"
name: prepare-release-no-version-given
description: No version or date given; the skill must ask instead of picking them.
tags: [prepare-release, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Time to cut a release.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: prepare-release
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-branch
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b)'
    min: 0
    max: 0
    arm: both
  - name: asks-version-and-date
    type: llm
    criteria: |
      Pass only if all hold:
      1. The reply asks the maintainer for the version number and the release date (suggesting 0.2.0 because pyproject.toml says 0.2.0.dev0 is fine, as long as it asks for confirmation).
      2. It doesn't claim any release changes were made.
