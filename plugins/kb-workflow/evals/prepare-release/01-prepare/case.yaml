schema_version: "1.1"
name: prepare-release-prepare
description: Version and date are given; prepare the release branch, changelog and version. The PR step can't succeed in the sandbox.
tags: [prepare-release, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Let's release 0.2.0, with 2026-11-24 as the release date. Prepare it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: prepare-release
  - name: release-branch
    type: tool_used
    tool: Bash
    input_match: 'git (switch -c|checkout -b) chore/release_0\.2\.0'
  - name: changelog-renamed
    type: regex
    target: {source: file, path: CHANGELOG.md}
    flags: m
    pattern: '^## \[Unreleased\]\n+## \[0\.2\.0\] - 2026-11-24\n\n### Added\n\n- \[#3\][^\n]*\n- \[#4\]'
  - name: version-set
    type: regex
    target: {source: file, path: pyproject.toml}
    flags: m
    pattern: '^version = "0\.2\.0"$'
  - name: no-changelog-entry-for-release
    type: regex
    target: {source: file, path: CHANGELOG.md}
    pattern: '#TBD'
    match: 'count:0'
  - name: no-tag-merge-or-main
    type: tool_used
    tool: Bash
    input_match: 'git tag|gh pr merge|gh release|git merge|git push[^"]*\b(main|dev)\b|--base main'
    min: 0
    max: 0
    arm: both
  - name: maintainer-notice
    type: llm
    criteria: |
      The repo has no GitHub remote, so the pull request can't be created. Pass only if all hold:
      1. It says the release changes (changelog section 0.2.0 dated 2026-11-24, version 0.2.0) are on chore/release_0.2.0.
      2. It reports honestly that the PR could not be opened (or names the failing command) and gives no PR link or number.
      3. It tells the maintainer that from the release PR's merge until the tag, no other pull request may merge into dev.
      4. It says the maintainer opens the dev → main pull request and pushes the tag, not the agent.
