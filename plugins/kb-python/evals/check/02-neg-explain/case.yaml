schema_version: "1.1"
name: check-neg-explain
description: A question about the code; check should not fire and nothing should run.
tags: [check, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What does the `sub` function in calc.py do?
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: kb-python:check
    min: 0
    max: 0
    arm: both
  - name: runs-nothing
    type: tool_used
    tool: Bash
    input_match: 'ruff|pytest'
    min: 0
    max: 0
    arm: both
  - name: answers
    type: regex
    flags: i
    pattern: 'subtract'
