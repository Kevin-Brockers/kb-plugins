schema_version: "1.1"
name: check-ruff-missing
description: ruff isn't a dev dependency; report it instead of installing it.
tags: [check, fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Check the project before I commit.
  max_turns: 20
  timeout_seconds: 450
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: kb-python:check
  - name: installs-nothing
    type: tool_used
    tool: Bash
    input_match: 'uv add|uvx|uv tool|uv pip install|pip3? install|pipx|brew install'
    min: 0
    max: 0
    arm: both
  - name: pyproject-unchanged
    type: regex
    target: {source: file, path: pyproject.toml}
    pattern: 'ruff'
    match: not_contains
  - name: report
    type: llm
    criteria: |
      Pass only if all hold:
      1. It reports that ruff is not available (`uv run ruff` failed to spawn ruff).
      2. It says adding ruff needs the maintainer's approval, or asks whether to add it, instead of installing it.
      3. It reports the pytest result (2 passed) if pytest was run, and doesn't claim lint or format passed.
